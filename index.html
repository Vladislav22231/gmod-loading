<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PIXELSANDBOX — Загрузка</title>
<style>
  :root{
    --bg:#0a0410;
    --bg2:#120818;
    --purple-deep:#5b1f9e;
    --purple:#9b3ff2;
    --purple-bright:#b978ff;
    --lilac:#e9d8ff;
    --white:#f5eeff;
    --dim:#8a7a9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  .screen{
    position:relative;
    width:100%;height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(120,40,200,0.20), transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(90,20,160,0.15), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(150,60,255,0.12), transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }


  /* Drifting particles */
  .particles{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .p{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--purple-bright);
    box-shadow:0 0 6px 1px var(--purple-bright);
    opacity:0.5;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.6;}
    90%{opacity:0.6;}
    100%{ transform:translateY(-120px) translateX(20px); opacity:0;}
  }

  /* Title */
  .title-wrap{
    position:relative; z-index:2;
    text-align:center;
  }
  .logo{
    font-size:9.5vw;
    font-weight:900;
    letter-spacing:0.04em;
    line-height:1;
    background:linear-gradient(180deg,
        var(--purple-bright) 0%, var(--purple-bright) 38%,
        var(--white) 42%, var(--white) 58%,
        var(--purple-deep) 62%, var(--purple-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 14px rgba(160,70,255,0.65)) drop-shadow(0 0 40px rgba(140,50,240,0.35));
    animation:flicker 5s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes flicker{
    0%,92%,100%{filter:drop-shadow(0 0 14px rgba(160,70,255,0.65)) drop-shadow(0 0 40px rgba(140,50,240,0.35));}
    94%{filter:drop-shadow(0 0 5px rgba(160,70,255,0.3)) drop-shadow(0 0 10px rgba(140,50,240,0.15));}
    95%{filter:drop-shadow(0 0 18px rgba(160,70,255,0.8)) drop-shadow(0 0 50px rgba(140,50,240,0.45));}
  }

  .divider{
    width:280px; height:1px; margin:22px auto 20px;
    background:linear-gradient(90deg, transparent, var(--purple-bright), transparent);
    box-shadow:0 0 8px var(--purple-bright);
    position:relative; z-index:2;
  }

  .welcome{
    font-size:15px; color:var(--dim); z-index:2; position:relative;
    letter-spacing:0.3px;
  }
  .welcome b{color:var(--lilac); font-weight:700;}

  .mapline{
    margin-top:10px; font-size:13px; letter-spacing:2px;
    color:var(--purple-bright); z-index:2; position:relative;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .mapline .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--purple-bright);
    box-shadow:0 0 8px var(--purple-bright);
  }

  /* Tip box */
  .tip-box{
    margin-top:42px;
    max-width:640px;
    text-align:center;
    z-index:2; position:relative;
    min-height:70px;
  }
  .tip-eyebrow{
    font-size:11px; letter-spacing:4px; color:var(--purple);
    text-transform:uppercase; margin-bottom:8px;
  }
  .tip-text{
    font-size:15px; color:#cbb9ea; line-height:1.5;
    animation:tipfade 6s ease-in-out infinite;
  }
  @keyframes tipfade{
    0%{opacity:0; transform:translateY(4px);}
    8%{opacity:1; transform:translateY(0);}
    88%{opacity:1;}
    100%{opacity:0;}
  }

  /* Load bar — placed under tips, wide like screenshot */
  .loadbar{
    margin:38px auto 0;
    width:78%;
    max-width:900px;
    z-index:2; position:relative;
  }
  .bartrack{
    width:100%; height:2px; background:rgba(255,255,255,0.10);
    border-radius:2px; position:relative; overflow:hidden;
  }
  .barfill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--purple-deep), var(--purple-bright));
    box-shadow:0 0 8px var(--purple-bright);
    border-radius:2px;
  }
  .barfill::after{
    content:'';
    position:absolute; right:0; top:0; bottom:0; width:14px;
    background:var(--white); filter:blur(4px); opacity:0.7;
  }
  .handle{
    position:relative; width:100%; height:0;
  }
  .handle-dot{
    position:absolute; top:-1px; width:8px; height:8px; border-radius:50%;
    background:var(--white);
    box-shadow:0 0 8px var(--purple-bright);
    transform:translate(-50%,-50%);
  }
  .barrow{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px;
  }
  .barlabel{
    font-size:11px; letter-spacing:1.5px; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-transform:uppercase;
  }
  .barpct{
    font-size:12px; color:var(--purple-bright); font-weight:700;
  }
  .siteurl{
    position:absolute; left:24px; bottom:16px;
    font-size:11px; letter-spacing:1px; color:var(--dim);
    z-index:2;
  }


</style>
</head>
<body>
<div class="screen">

  <div class="particles" id="particles"></div>

  <div class="title-wrap">
    <div class="logo">PIXELSANDBOX</div>
  </div>

  <div class="divider"></div>

  <div class="welcome">Добро пожаловать на <b>PixelSandbox</b></div>
  <div class="mapline"><span class="dot"></span>SANDBOX EVOLVED &nbsp;•&nbsp; SEASON 3</div>

  <div class="tip-box">
    <div class="tip-eyebrow">// Совет новичкам</div>
    <div class="tip-text" id="tipText"></div>
  </div>

  <div class="loadbar">
    <div class="bartrack">
      <div class="barfill"></div>
      <div class="handle"><div class="handle-dot"></div></div>
    </div>
    <div class="barrow">
      <div class="barlabel" id="stageLabel">ЗАГРУЗКА АДДОНОВ ВОРКШОПА</div>
      <div class="barpct" id="pctLabel">2%</div>
    </div>
  </div>

  <div class="siteurl">PIXELSANDBOX.UA</div>

</div>

<script>
  // particles
  const pc = document.getElementById('particles');
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='p';
    p.style.left = Math.random()*100+'%';
    p.style.top = (60+Math.random()*40)+'%';
    p.style.animationDuration = (6+Math.random()*8)+'s';
    p.style.animationDelay = (Math.random()*8)+'s';
    p.style.opacity = 0.3+Math.random()*0.5;
    pc.appendChild(p);
  }

  // tips rotation — новичкам про типичный sandbox-сервер (S&box/GMod-style)
  const tips = [
    "Зажми Q, чтобы открыть меню спавна пропов и инструментов.",
    "Physgun поднимает и двигает объекты — зажми ЛКМ на пропе, чтобы схватить его.",
    "Toolgun (инструмент) позволяет крепить, красить и настраивать физику пропов.",
    "Команда !rtd не работает на PvP-картах — уточняй правила в /rules.",
    "Строй базу в отведённой зоне — вне зоны билды удаляются автоочисткой.",
    "Используй !tp <ник>, чтобы телепортироваться к другу, если он разрешил телепорт.",
    "Нажми Tab, чтобы увидеть список онлайн-игроков и их роли.",
    "Донат-привилегии открывают доп. слоты пропов и приватные зоны — подробнее на pixelsandbox.ua",
    "Если завис в текстуре — набери !stuck в чат, чтобы телепортироваться в безопасное место.",
    "Сохраняй свои постройки через дупликатор (Duplicator), чтобы не строить заново после рестарта.",
    "Не спавни слишком много пропов сразу — есть лимит, чтобы не лагал сервер.",
    "Дискорд сервера обязателен для апелляций и репортов — ссылка в /discord.",
  ];
  let ti = 0;
  const tipEl = document.getElementById('tipText');
  function showTip(){
    tipEl.style.animation='none';
    void tipEl.offsetWidth;
    tipEl.textContent = tips[ti % tips.length];
    tipEl.style.animation='tipfade 6s ease-in-out infinite';
    ti++;
  }
  showTip();
  setInterval(showTip, 6000);

  // реалистичная симуляция загрузки: список файлов/аддонов, каждый грузится до 100%,
  // общий прогресс = позиция в очереди + прогресс текущего файла
  const queue = [
    "maps/rp_pixelcity_v3.bsp",
    "addon_darkrpmodification.gma",
    "materials/props_pixel/pack_02.vtf",
    "models/weapons/w_pixelpistol.mdl",
    "addon_advanced_duplicator2.gma",
    "sound/pixelsandbox/ambient_pack.mp3",
    "lua/autorun/sb_pixel_core.lua",
    "addon_wiremod.gma",
    "particles/pixel_fx.pcf",
    "addon_simfphys_vehicles.gma",
    "resource/fonts/pixel_ui.ttf",
    "синхронизация с сервером...",
  ];
  const stageLabel = document.getElementById('stageLabel');
  const pctLabel = document.getElementById('pctLabel');
  const barfillEl = document.querySelector('.barfill');
  const handleDot = document.querySelector('.handle-dot');
  barfillEl.style.animation = 'none';
  handleDot.style.animation = 'none';

  let fileIndex = 0;
  let fileProgress = 0;

  function stepLoad(){
    // случайный прирост, имитирующий неравномерную реальную загрузку
    fileProgress += Math.random()*14 + 3;
    if(fileProgress >= 100){
      fileProgress = 0;
      fileIndex = (fileIndex + 1) % queue.length;
    }
    const overall = Math.min(100, Math.round(((fileIndex + fileProgress/100) / queue.length) * 100));
    stageLabel.textContent = queue[fileIndex];
    pctLabel.textContent = overall + '%';
    barfillEl.style.width = overall + '%';
    handleDot.style.left = overall + '%';

    const delay = 120 + Math.random()*260;
    setTimeout(stepLoad, delay);
  }
  stepLoad();

</script>
</body>
</html>
