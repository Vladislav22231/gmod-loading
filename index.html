<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelSandbox Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #06070a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #e84dff;
    --cyan: #00e0ff;
    --glass: rgba(13, 16, 24, .75);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    user-select: none;
    height: 100vh;
    position: relative;
}

/* Мягкие плавающие неоновые пятна (без яркой заливки) */
body::before {
    content: '';
    position: absolute;
    top: -20%;
    left: -20%;
    width: 140%;
    height: 140%;
    /* Приглушенные точечные градиенты с высокой прозрачностью */
    background-image: 
        radial-gradient(circle at 45% 50%, rgba(160, 40, 220, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 20% 30%, rgba(232, 77, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 224, 255, 0.12) 0%, transparent 40%);
    z-index: 1;
    /* Медленная плавная анимация движения и «дыхания» */
    animation: smoothGlow 16s ease-in-out infinite alternate;
}

@keyframes smoothGlow {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.7;
    }
    50% {
        transform: translate(-3%, 2%) scale(1.08);
        opacity: 1;
    }
    100% {
        transform: translate(3%, -2%) scale(0.95);
        opacity: 0.6;
    }
}

/* Общий стиль стеклянных панелей */
.glass-panel {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(232, 77, 255, .35);
    border-radius: 14px;
    box-shadow: 0 0 35px rgba(180, 50, 255, 0.25), inset 0 0 15px rgba(232, 77, 255, 0.05);
}

/* Кнопки слева вверху */
.social-buttons {
    position: absolute;
    top: 24px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    text-decoration: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid rgba(0, 224, 255, .3);
    border-radius: 10px;
    transition: all 0.3s ease;
    cursor: pointer;
    animation: btnGlow 3s ease-in-out infinite alternate;
}

.btn-discord {
    animation-delay: 0s;
}

.btn-telegram {
    animation-delay: 1.5s;
}

@keyframes btnGlow {
    0% {
        box-shadow: 0 0 5px rgba(0, 224, 255, 0.2), inset 0 0 5px rgba(0, 224, 255, 0.1);
        border-color: rgba(0, 224, 255, 0.3);
    }
    100% {
        box-shadow: 0 0 18px rgba(232, 77, 255, 0.45), inset 0 0 8px rgba(232, 77, 255, 0.25);
        border-color: rgba(232, 77, 255, 0.6);
    }
}

.btn:hover {
    background: rgba(0, 224, 255, 0.2);
    border-color: var(--cyan);
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 0 22px rgba(0, 224, 255, 0.6);
    color: #ffffff;
}

/* Центральный блок */
.center-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 780px;
    max-width: 95vw;
    padding: 26px 30px;
    text-align: center;
    z-index: 10;
}

h1.title {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: .5px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, #f070ff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(232, 77, 255, 0.3);
}

.subtitle {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    opacity: .95;
    margin-bottom: 24px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.progress-container {
    width: 100%;
    height: 14px;
    background: rgba(255, 255, 255, .08);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 0 20px rgba(232, 77, 255, .25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e84dff, #00e0ff);
    transition: width 0.2s ease;
    box-shadow: 0 0 8px #e84dff, 0 0 18px #00e0ff, 0 0 30px #00e0ff;
}

.status-text {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.info-card {
    position: absolute;
    right: 24px;
    bottom: 24px;
    min-width: 340px;
    padding: 16px 18px;
    font-size: 14px;
    z-index: 10;
}

.info-row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    color: var(--muted);
}

.info-value {
    color: var(--text);
    font-weight: 600;
    text-align: right;
    max-width: 180px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

@media (max-width: 768px) {
    h1.title { font-size: 36px; }
    .subtitle { font-size: 10px; }
    .center-card { transform: none; position: static; margin: 80px 16px; width: auto; }
    .info-card { position: static; margin: 16px; }
}
</style>
</head>
<body>

<!-- Кнопки Соцсетей -->
<div class="social-buttons">
    <a href="https://discord.gg/UmGHaVrZ" target="_blank" class="btn btn-discord glass-panel">Discord</a>
    <a href="https://t.me/PixelCanvasSandboxServer" target="_blank" class="btn btn-telegram glass-panel">Telegram</a>
</div>

<!-- Центральное меню -->
<div class="center-card glass-panel">
    <h1 class="title">PixelSandbox</h1>
    <div class="subtitle">• UA Украинский Sandbox • 100+ аддонов • Безграничные возможности • Активное сообщество •</div>

    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="status-text" id="status">Подключение... 0%</div>
</div>

<!-- Инфо-блок снизу справа -->
<div class="info-card glass-panel">
    <div class="info-row">
        <span>🗺 Карта</span>
        <strong class="info-value" id="map-name">Загрузка...</strong>
    </div>
    <div class="info-row">
        <span>👥 Игроков</span>
        <strong class="info-value" id="players-count">0 / 20</strong>
    </div>
    <div class="info-row">
        <span>🎮 Режим</span>
        <strong class="info-value" id="gamemode">Sandbox</strong>
    </div>
</div>

<script>
const bar = document.getElementById("bar");
const statusText = document.getElementById("status");

const stages = {
    "Sending client info": 10,
    "Receiving server info": 20,
    "Starting Lua": 40,
    "Downloading": 70,
    "Mounting Addons": 90
};

window.SetStatusChanged = function(status) {
    statusText.textContent = status;

    for (const key in stages) {
        if (status.includes(key)) {
            bar.style.width = stages[key] + "%";
            return;
        }
    }
};

window.DownloadingFile = function(file) {
    statusText.textContent = "📥 " + file;
};

window.SetFilesTotal = function(total) {
    window.totalFiles = total;
};

window.SetFilesNeeded = function(needed) {
    if (!window.totalFiles) return;

    const loaded = window.totalFiles - needed;
    const percent = Math.floor((loaded / window.totalFiles) * 100);

    bar.style.width = percent + "%";
    statusText.textContent = "Загрузка файлов... " + percent + "%";
};

window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("map-name").textContent = mapname || "Загрузка...";
    document.getElementById("players-count").textContent = "0 / " + (maxplayers || "20");
    if (gamemode) {
        document.getElementById("gamemode").textContent = gamemode;
    }
};

async function updateServer() {
    try {
        const res = await fetch("http://26.214.76.58:3000/status");
        const data = await res.json();

        if (data.online) {
            document.getElementById("map-name").textContent = data.map;
            document.getElementById("players-count").textContent = data.players + " / " + data.maxplayers;
            document.getElementById("gamemode").textContent = "Sandbox";
        } else {
            document.getElementById("map-name").textContent = "Сервер офлайн";
            document.getElementById("players-count").textContent = "--";
        }
    } catch (err) {
        console.log("Ошибка загрузки внешнего статуса:", err);
    }
}

updateServer();
setInterval(updateServer, 10000);
</script>

</body>
</html>
