<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelSandbox — Void</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#020204;
  color:#e6e2ff;
  font:14px Arial
}

.void{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  width:330px;
  height:330px;
  border-radius:50%;
  background:#000;
  /* Сделали тени диска плотнее и ярче, чтобы они не блекли при сетевой загрузке */
  box-shadow:0 0 0 1px rgba(118, 86, 255, 0.4), 0 0 100px rgba(93, 61, 255, 0.3);
  will-change: transform;
}

/* Первое кольцо: увеличили базовую видимость границ */
.void:before{
  content:"";
  position:absolute;
  inset:-58px;
  border:1px solid rgba(138, 117, 255, 0.25);
  border-radius:50%;
  box-shadow:0 0 70px rgba(118, 93, 255, 0.2);
  will-change: transform;
  animation:voidHalo 7s linear infinite
}

/* Второе кольцо: сделали неоновую тень существенно ярче */
.void:after{
  content:"";
  position:absolute;
  inset:-40px;
  border:1px solid rgba(111, 92, 255, 0.35);
  border-radius:50%;
  box-shadow:0 0 75px rgba(118, 93, 255, 0.45);
  will-change: transform;
  animation:p 4s ease-in-out infinite
}

/* Фикс анимации для GitHub: убрали скачки opacity, оставили только scale */
@keyframes p{
  0% {
    transform: rotate(0deg) scale(1.0);
  }
  50%{
    transform: rotate(180deg) scale(1.08);
  }
  100% {
    transform: rotate(360deg) scale(1.0);
  }
}

@keyframes voidHalo{
  from {
    transform: rotate(0deg) scale(1.0);
  }
  50% {
    transform: rotate(180deg) scale(1.04);
  }
  to {
    transform: rotate(360deg) scale(1.0);
  }
}

.panel{
  position:absolute;
  top:73%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(800px,86vw);
  text-align:center
}

.tag{
  color:#806cff;
  font-size:10px;
  letter-spacing:6px
}

.title{
  font-size:52px;
  font-weight:800;
  margin:9px;
  color: #fff;
  animation:voidText 4s ease-in-out infinite
}

@keyframes voidText{
  50%{
    text-shadow:0 0 28px #765dff55
  }
}

.sub{
  color:#605a78
}

.stats{
  display:flex;
  justify-content:center;
  gap:60px;
  margin:25px
}

.stats span{
  display:block;
  color:#55506a;
  font-size:9px
}

.stats b{
  display:block;
  margin-top:6px;
  color: #fff;
}

.head{
  display:flex;
  justify-content:space-between;
  color:#77708d;
  font-size:11px
}

.track{
  height:4px;
  background:#171326;
  margin-top:8px
}

.bar{
  height:100%;
  width:0;
  background:#8a75ff;
  box-shadow:0 0 18px #765dff;
  transition:.2s
}

.file{
  margin-top:8px;
  color:#4b455c;
  font-size:10px;
  height: 15px;
}

.tip{
  margin-top:20px;
  color:#514a64;
  height: 20px;
}

/* Фикс фонового свечения: сделали подложку плотнее, чтобы компенсировать сжатие цвета в GMod */
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 42%, rgba(138, 117, 255, 0.08), transparent 45%);
  animation:deepVoid 4s ease-in-out infinite alternate
}

@keyframes deepVoid{
  to{
    opacity:.9;
    transform:scale(1.08)
  }
}

.watermark{
  position:fixed;
  left:22px;
  bottom:18px;
  z-index:30;
  color:rgba(160,145,210,.18);
  font-size:11px;
  font-weight:800;
  text-transform: uppercase;
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(118,93,255,.04);
  pointer-events:none;
  user-select:none
}
</style>
</head>

<body>

<div class="void"></div>
<div class="watermark">pixelsandbox.ua</div>

<main class="panel">
  <div class="tag"></div>
  <div class="title" id="server">PIXELSANDBOX</div>
  <div class="sub">A new world is forming.</div>

  <div class="stats">
    <div>
      <span>MAP</span>
      <b id="map">---</b>
    </div>

    <div>
      <span>PLAYERS</span>
      <b>
        <span id="players">—</span>/<span id="maxplayers">—</span>
      </b>
    </div>

    <div>
      <span>MODE</span>
      <b id="mode">SANDBOX</b>
    </div>
  </div>

  <div class="head">
    <span id="status">Opening</span>
    <b id="percent">0%</b>
  </div>

  <div class="track">
    <div class="bar" id="progress"></div>
  </div>

  <div class="file" id="file"></div>
  <div class="tip" id="tip"></div>
</main>

<script>
let S={
  map:"Loading world...",
  players:"—",
  mode:"Sandbox",
  status:"Connecting",
  total:0,
  needed:0,
  done:0
};

const $=id=>document.getElementById(id);

const set=(id,v)=>{
  if($(id))$(id).textContent=String(v)
};

function progress(){
  let p=S.total>0
    ?Math.max(0,Math.min(100,((S.total-S.needed)/S.total)*100))
    :Math.min(96,S.done);

  if($("progress"))
    $("progress").style.width=p+"%";

  set("percent",Math.round(p)+"%");
}

function GameDetails(
  servername,
  serverurl,
  mapname,
  maxplayers,
  steamid,
  gamemode,
  volume,
  language
){
  S.map=mapname||"Unknown";
  S.mode=gamemode||"Sandbox";

  set("map",S.map);
  set("mode",S.mode);

  if($("maxplayers"))
    set("maxplayers",maxplayers??"—");
}

function SetStatusChanged(status){
  S.status=status||"Loading";
  set("status",S.status)
}

function SetFilesTotal(total){
  S.total=Number(total)||0;
  progress()
}

function SetFilesNeeded(needed){
  S.needed=Number(needed)||0;
  progress()
}

function DownloadingFile(fileName){
  S.done++;
  set("file",fileName||"Preparing files...");
  progress()
}

async function players(){
  try{
    let r=await fetch("player_count.php",{cache:"no-store"});
    if(!r.ok)return;

    let d=await r.json();
    let n=d.players??d.count??d.player_count;

    if(n!==undefined){
      S.players=n;
      set("players",n)
    }
  }catch(e){}
}

players();
setInterval(players,5000);

setTimeout(()=>{
  if(S.map==="Loading world..."){
    S.map="gm_construct";
    set("map",S.map)
  }
},1800);
</script>

<script>
(()=> {
  const c=document.createElement("canvas");
  c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19;opacity:.8";
  document.body.appendChild(c);
  const x=c.getContext("2d");
  let W,H,D,ps=[];

  function rs(){
    W=innerWidth; H=innerHeight;
    D=Math.min(devicePixelRatio||1,2);
    c.width=W*D; c.height=H*D;
    x.setTransform(D,0,0,D,0,0);
    ps=Array.from({length:90},()=>({
      x:Math.random()*W,
      y:Math.random()*H,
      r:.3+Math.random()*1.4,
      v:.08+Math.random()*.35,
      a:.12+Math.random()*.5,
      p:Math.random()*7
    }))
  }
  addEventListener("resize",rs);
  rs();

  function loop(){
    x.clearRect(0,0,W,H);
    const accent=getComputedStyle(document.body).color||"#fff";
    for(const p of ps){
      p.y-=p.v;
      if(p.y<0)p.y=H;
      p.x+=Math.sin(p.p+p.y*.008)*.08;
      x.globalAlpha=p.a*(.55+.45*Math.sin(performance.now()/700+p.p));
      x.fillStyle=accent;
      x.beginPath();
      x.arc(p.x,p.y,p.r,0,Math.PI*2);
      x.fill()
    }
    requestAnimationFrame(loop)
  }
  loop()
})();
</script>
