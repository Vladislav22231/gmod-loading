<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PIXELSANDBOX — Загрузка</title>
<style>
  :root{
    --bg:#0a0410;
    --bg2:#120818;
    --purple-deep:#5b1f9e;
    --purple:#9b3ff2;
    --purple-bright:#b978ff;
    --lilac:#e9d8ff;
    --white:#f5eeff;
    --dim:#8a7a9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  .screen{
    position:relative;
    width:100%;height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(120,40,200,0.20), transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(90,20,160,0.15), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(150,60,255,0.12), transparent 50%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }


  /* Drifting particles */
  .particles{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .p{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--purple-bright);
    box-shadow:0 0 6px 1px var(--purple-bright);
    opacity:0.5;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.6;}
    90%{opacity:0.6;}
    100%{ transform:translateY(-120px) translateX(20px); opacity:0;}
  }

  /* Emblem */
  .emblem{
    position:relative; z-index:2;
    width:54px; height:54px;
    margin:0 auto -6px;
    filter:drop-shadow(0 0 4px rgba(160,80,255,0.6));
    animation:emblempulse 4s ease-in-out infinite;
  }
  .emblem svg{width:100%; height:100%;}
  @keyframes emblempulse{
    0%,100%{ transform:translateY(0) scale(1); filter:drop-shadow(0 0 4px rgba(160,80,255,0.6));}
    50%{ transform:translateY(-3px) scale(1.03); filter:drop-shadow(0 0 7px rgba(160,80,255,0.85));}
  }

  .tip-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:14px; height:14px; margin-right:7px;
    vertical-align:-2px;
  }
  .tip-icon svg{width:100%; height:100%; stroke:var(--purple-bright); fill:none; stroke-width:2;
    filter:drop-shadow(0 0 4px rgba(160,80,255,0.6));}

  /* Title */
  .title-wrap{
    position:relative; z-index:2;
    text-align:center;
  }
  .logo{
    font-size:9.5vw;
    font-weight:900;
    letter-spacing:0.04em;
    line-height:1;
    background:linear-gradient(180deg,
        #c9a3f5 0%, #c9a3f5 42%,
        #ffffff 45%, #ffffff 54%,
        #8b4fd6 57%, #8b4fd6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    text-shadow:
      0 0 14px rgba(160,70,255,0.65),
      0 0 40px rgba(140,50,240,0.35),
      0 0 80px rgba(140,50,240,0.20);
    animation:flicker 5s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes flicker{
    0%,92%,100%{ text-shadow:
      0 0 14px rgba(160,70,255,0.65),
      0 0 40px rgba(140,50,240,0.35),
      0 0 80px rgba(140,50,240,0.20);}
    94%{ text-shadow:
      0 0 5px rgba(160,70,255,0.3),
      0 0 10px rgba(140,50,240,0.15);}
    95%{ text-shadow:
      0 0 18px rgba(160,70,255,0.8),
      0 0 50px rgba(140,50,240,0.45),
      0 0 90px rgba(140,50,240,0.25);}
  }

  .divider{
    width:280px; height:1px; margin:22px auto 20px;
    background:linear-gradient(90deg, transparent, var(--purple-bright), transparent);
    box-shadow:0 0 8px var(--purple-bright);
    position:relative; z-index:2;
  }

  .welcome{
    font-size:15px; color:var(--dim); z-index:2; position:relative;
    letter-spacing:0.3px;
  }
  .welcome b{color:var(--lilac); font-weight:700;}

  .mapline{
    margin-top:10px; font-size:13px; letter-spacing:2px;
    color:var(--purple-bright); z-index:2; position:relative;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .mapline .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--purple-bright);
    box-shadow:0 0 8px var(--purple-bright);
  }

  /* Tip box */
  .tip-box{
    margin-top:42px;
    max-width:640px;
    text-align:center;
    z-index:2; position:relative;
    min-height:70px;
  }
  .tip-eyebrow{
    font-size:11px; letter-spacing:4px; color:var(--purple);
    text-transform:uppercase; margin-bottom:8px;
  }
  .tip-text{
    font-size:15px; color:#cbb9ea; line-height:1.5;
    animation:tipfade 6s ease-in-out infinite;
  }
  @keyframes tipfade{
    0%{opacity:0; transform:translateY(4px);}
    8%{opacity:1; transform:translateY(0);}
    88%{opacity:1;}
    100%{opacity:0;}
  }

  /* Load bar — placed under tips, wide like screenshot */
  .loadbar{
    margin:38px auto 0;
    width:78%;
    max-width:900px;
    z-index:2; position:relative;
  }
  .bartrack{
    width:100%; height:2px; background:rgba(255,255,255,0.10);
    border-radius:2px; position:relative; overflow:hidden;
  }
  .barfill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--purple-deep), var(--purple-bright));
    box-shadow:0 0 8px var(--purple-bright);
    border-radius:2px;
  }
  .barfill::after{
    content:'';
    position:absolute; right:0; top:0; bottom:0; width:14px;
    background:var(--white); filter:blur(4px); opacity:0.7;
  }
  .handle{
    position:relative; width:100%; height:0;
  }
  .handle-dot{
    position:absolute; top:-1px; width:8px; height:8px; border-radius:50%;
    background:var(--white);
    box-shadow:0 0 8px var(--purple-bright);
    transform:translate(-50%,-50%);
  }
  .barrow{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:9px;
  }
  .barlabel{
    font-size:11px; letter-spacing:1.5px; color:var(--dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-transform:uppercase;
  }
  .barpct{
    font-size:12px; color:var(--purple-bright); font-weight:700;
  }
  .siteurl{
    position:absolute; left:24px; bottom:16px;
    font-size:11px; letter-spacing:1px; color:var(--dim);
    z-index:2;
  }


</style>
</head>
<body>
<div class="screen">

  <div class="particles" id="particles"></div>

  <div class="emblem">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="none" stroke="url(#emgrad)" stroke-width="3"/>
      <polygon points="32,4 58,18 32,32 6,18" fill="url(#emgrad)" opacity="0.4"/>
      <line x1="32" y1="32" x2="32" y2="60" stroke="url(#emgrad)" stroke-width="1.4" opacity="0.6"/>
      <line x1="32" y1="32" x2="6" y2="18" stroke="url(#emgrad)" stroke-width="1.4" opacity="0.35"/>
      <line x1="32" y1="32" x2="58" y2="18" stroke="url(#emgrad)" stroke-width="1.4" opacity="0.35"/>
      <defs>
        <linearGradient id="emgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d6b6ff"/>
          <stop offset="100%" stop-color="#7a35c9"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <div class="title-wrap">
    <div class="logo">PIXELSANDBOX</div>
  </div>

  <div class="divider"></div>

  <div class="welcome">Добро пожаловать на <b>PixelSandbox</b></div>
  <div class="mapline"><span class="dot"></span>ДРУЖЕЛЮБНЫЙ SANDBOX-СЕРВЕР</div>

  <div class="tip-box">
    <div class="tip-eyebrow"><span class="tip-icon" id="tipIcon"></span>Совет новичкам</div>
    <div class="tip-text" id="tipText"></div>
  </div>

  <div class="loadbar">
    <div class="bartrack">
      <div class="barfill"></div>
      <div class="handle"><div class="handle-dot"></div></div>
    </div>
    <div class="barrow">
      <div class="barlabel" id="stageLabel">ЗАГРУЗКА АДДОНОВ ВОРКШОПА</div>
      <div class="barpct" id="pctLabel">2%</div>
    </div>
  </div>

  <div class="siteurl">PIXELSANDBOX.UA</div>

</div>

<script>
  // particles
  const pc = document.getElementById('particles');
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='p';
    p.style.left = Math.random()*100+'%';
    p.style.top = (60+Math.random()*40)+'%';
    p.style.animationDuration = (6+Math.random()*8)+'s';
    p.style.animationDelay = (Math.random()*8)+'s';
    p.style.opacity = 0.3+Math.random()*0.5;
    pc.appendChild(p);
  }

  // tips rotation — новичкам про типичный sandbox-сервер (S&box/GMod-style)
  const tips = [
    "Зажми Q, чтобы открыть меню спавна пропов и инструментов.",
    "Physgun поднимает и двигает объекты — зажми ЛКМ на пропе, чтобы схватить его.",
    "Toolgun позволяет крепить, красить и настраивать физику пропов.",
    "Используй Weld, чтобы жёстко соединить два пропа между собой.",
    "Сохраняй свои постройки через Advanced Duplicator 2 (ADV2), чтобы не строить заново после рестарта.",
    "Зажми R для быстрого доступа к последнему использованному инструменту.",
    "Не спавни слишком много пропов сразу — есть лимит, чтобы не лагал сервер.",
    "Нажми Tab, чтобы увидеть список онлайн-игроков на сервере.",
    "Используй Thruster и Wheel из Wiremod, чтобы построить свою первую машину.",
    "Если завис в текстуре — набери !stuck в чат, чтобы телепортироваться в безопасное место.",
    "Donator-привилегии открывают доп. слоты пропов и приватные зоны — подробнее на pixelsandbox.ua",
    "Дискорд сервера обязателен для апелляций и репортов — ссылка в /discord.",
  ];
  // простые line-иконки под каждый совет (в том же порядке, что и tips)
  const tipIcons = [
    '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M4 9h16"/></svg>', // спавн-меню
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/></svg>', // physgun
    '<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2z"/></svg>', // toolgun/wrench
    '<svg viewBox="0 0 24 24"><path d="M8 12h8M8 8h8M8 16h8"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>', // weld/link
    '<svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M7 3v6h8V3"/></svg>', // save/duplicator
    '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>', // клавиша R
    '<svg viewBox="0 0 24 24"><path d="M12 2 2 20h20L12 2Z"/><path d="M12 9v5M12 17h.01"/></svg>', // лимит/предупреждение
    '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="18" cy="9" r="2.4"/></svg>', // список игроков
    '<svg viewBox="0 0 24 24"><path d="M4 16v-3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>', // машина/wiremod
    '<svg viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="M9 15l3-3 3 3 5-5"/></svg>', // stuck/телепорт
    '<svg viewBox="0 0 24 24"><path d="m12 2 2.7 6.6L22 9l-5.4 4.8L18 21l-6-3.6L6 21l1.4-7.2L2 9l7.3-.4L12 2Z"/></svg>', // донат/звезда
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 13c1 1.3 2.4 2 4 2s3-.7 4-2M9 9h.01M15 9h.01"/></svg>', // дискорд
  ];
  let ti = 0;
  const tipEl = document.getElementById('tipText');
  const tipIconEl = document.getElementById('tipIcon');
  function showTip(){
    tipEl.style.animation='none';
    void tipEl.offsetWidth;
    const idx = ti % tips.length;
    tipEl.textContent = tips[idx];
    tipIconEl.innerHTML = tipIcons[idx % tipIcons.length];
    tipEl.style.animation='tipfade 6s ease-in-out infinite';
    ti++;
  }
  showTip();
  setInterval(showTip, 6000);

  // реалистичная симуляция загрузки: список файлов/аддонов, каждый грузится до 100%,
  // общий прогресс = позиция в очереди + прогресс текущего файла
  const queue = [
    "maps/rp_pixelcity_v3.bsp",
    "addon_sandbox_tools.gma",
    "materials/props_pixel/pack_02.vtf",
    "models/weapons/w_pixelpistol.mdl",
    "addon_advanced_duplicator2.gma",
    "sound/pixelsandbox/ambient_pack.mp3",
    "lua/autorun/sb_pixel_core.lua",
    "addon_wiremod.gma",
    "particles/pixel_fx.pcf",
    "addon_simfphys_vehicles.gma",
    "resource/fonts/pixel_ui.ttf",
    "синхронизация с сервером...",
  ];
  const stageLabel = document.getElementById('stageLabel');
  const pctLabel = document.getElementById('pctLabel');
  const barfillEl = document.querySelector('.barfill');
  const handleDot = document.querySelector('.handle-dot');
  barfillEl.style.animation = 'none';
  handleDot.style.animation = 'none';

  let fileIndex = 0;
  let fileProgress = 0;

  function stepLoad(){
    // случайный прирост, имитирующий неравномерную реальную загрузку
    fileProgress += Math.random()*14 + 3;
    if(fileProgress >= 100){
      fileProgress = 0;
      fileIndex = (fileIndex + 1) % queue.length;
    }
    const overall = Math.min(100, Math.round(((fileIndex + fileProgress/100) / queue.length) * 100));
    stageLabel.textContent = queue[fileIndex];
    pctLabel.textContent = overall + '%';
    barfillEl.style.width = overall + '%';
    handleDot.style.left = overall + '%';

    const delay = 120 + Math.random()*260;
    setTimeout(stepLoad, delay);
  }
  stepLoad();

</script>
</body>
</html>
