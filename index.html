<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelSandbox Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #06070a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #e84dff;
    --cyan: #00e0ff;
    --glass: rgba(13, 16, 24, .75);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden !important;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #06070a;
    user-select: none;
    position: relative;
}

/* СИНЕ-ФИОЛЕТОВЫЙ ФОН (25%) */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        radial-gradient(circle at 20% 45%, rgba(148, 33, 210, 0.28) 0%, rgba(70, 13, 140, 0.1) 45%, transparent 70%),
        radial-gradient(circle at 15% 20%, rgba(192, 58, 222, 0.19) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(0, 192, 232, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(13, 42, 100, 0.25) 0%, transparent 60%);
    z-index: 1;
    animation: breathingGlow 8s ease-in-out infinite alternate;
}

@keyframes breathingGlow {
    0% { opacity: 0.44; }
    50% { opacity: 0.76; }
    100% { opacity: 0.50; }
}

/* Общий стиль стеклянных панелей */
.glass-panel {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(232, 77, 255, .35);
    border-radius: 16px;
    box-shadow: 0 0 35px rgba(180, 50, 255, 0.2), inset 0 0 15px rgba(232, 77, 255, 0.05);
}

/* Единая центральная карточка */
.center-card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 780px;
    padding: 28px 32px;
    text-align: center;
    z-index: 10;
}

h1.title {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: .5px;
    margin: 0 0 4px;
    background: linear-gradient(90deg, #f070ff, var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(232, 77, 255, 0.3);
}

.subtitle {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    opacity: .9;
    margin-bottom: 20px;
}

/* Горизонтальный мини-бар со статусом сервера */
.server-stats-bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 22px;
}

.stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
}

.stat-item strong {
    color: #ffffff;
    font-weight: 600;
}

.stat-divider {
    width: 1px;
    height: 16px;
    background: rgba(255, 255, 255, 0.15);
}

/* Секция загрузки */
.progress-container {
    width: 100%;
    height: 14px;
    background: rgba(255, 255, 255, .08);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 0 20px rgba(232, 77, 255, .2);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e84dff, #00e0ff);
    transition: width 0.2s ease;
    box-shadow: 0 0 8px #e84dff, 0 0 18px #00e0ff;
}

.status-text {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Кнопка включения/выключения звука */
.sound-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 100;
    background: var(--glass);
    border: 1px solid rgba(232, 77, 255, .35);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
}
.sound-toggle:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 15px rgba(0, 224, 255, 0.3);
}
</style>
</head>
<body>

<!-- Аудио элемент с фоновой музыкой -->
<audio id="bg-music" loop autoplay>
    <source src="https://cdn.discordapp.com/attachments/1319008652954435626/1531363784516571276/music.mp3?ex=6a68f129&is=6a679fa9&hm=9a80ae7d5be69d6dae7d155a66b4834743d6365c704ea04fc5e362a91791f0b7&" type="audio/mpeg">
</audio>

<!-- Кнопка управления звуком -->
<button class="sound-toggle" id="sound-btn" onclick="toggleSound()">🔊 Звук: Вкл</button>

<!-- Центральное меню -->
<div class="center-card glass-panel">
    <h1 class="title">PixelSandbox</h1>
    <div class="subtitle">• UA Украинский Sandbox • 100+ аддонов • Безграничные возможности •</div>

    <!-- Инфо о сервере в один ряд -->
    <div class="server-stats-bar">
        <div class="stat-item">
            <span>🗺 Карта:</span>
            <strong id="map-name">Загрузка...</strong>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span>👥 Игроки:</span>
            <strong id="players-count">0 / 20</strong>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
            <span>🎮 Режим:</span>
            <strong id="gamemode">Sandbox</strong>
        </div>
    </div>

    <!-- Полоса загрузки -->
    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="status-text" id="status">Подключение... 0%</div>
</div>

<script>
const bar = document.getElementById("bar");
const statusText = document.getElementById("status");
const music = document.getElementById("bg-music");
const soundBtn = document.getElementById("sound-btn");

music.volume = 0.5;

document.addEventListener('click', () => {
    if (music.paused) {
        music.play().catch(() => {});
    }
}, { once: true });

function toggleSound() {
    if (music.muted) {
        music.muted = false;
        soundBtn.textContent = "🔊 Звук: Вкл";
    } else {
        music.muted = true;
        soundBtn.textContent = "🔇 Звук: Выкл";
    }
}

const stages = {
    "Sending client info": 10,
    "Receiving server info": 20,
    "Starting Lua": 40,
    "Downloading": 70,
    "Mounting Addons": 90
};

window.SetStatusChanged = function(status) {
    statusText.textContent = status;

    for (const key in stages) {
        if (status.includes(key)) {
            bar.style.width = stages[key] + "%";
            return;
        }
    }
};

window.DownloadingFile = function(file) {
    statusText.textContent = "📥 " + file;
};

window.SetFilesTotal = function(total) {
    window.totalFiles = total;
};

window.SetFilesNeeded = function(needed) {
    if (!window.totalFiles) return;

    const loaded = window.totalFiles - needed;
    const percent = Math.floor((loaded / window.totalFiles) * 100);

    bar.style.width = percent + "%";
    statusText.textContent = "Загрузка файлов... " + percent + "%";
};

window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("map-name").textContent = mapname || "Загрузка...";
    document.getElementById("players-count").textContent = "0 / " + (maxplayers || "20");
    if (gamemode) {
        document.getElementById("gamemode").textContent = gamemode;
    }
};

async function updateServer() {
    try {
        const res = await fetch("http://26.214.76.58:3000/status");
        const data = await res.json();

        if (data.online) {
            document.getElementById("map-name").textContent = data.map;
            document.getElementById("players-count").textContent = data.players + " / " + data.maxplayers;
            document.getElementById("gamemode").textContent = "Sandbox";
        } else {
            document.getElementById("map-name").textContent = data.map || "Сервер офлайн";
            document.getElementById("players-count").textContent = "--";
        }
    } catch (err) {
        console.log("Ошибка загрузки внешнего статуса:", err);
    }
}

updateServer();
setInterval(updateServer, 10000);
</script>

</body>
</html>
