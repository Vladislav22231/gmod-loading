<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixelSandbox — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14;--text:#e6e9ef;--muted:#9aa3b2;
    --accent:#e84dff;--cyan:#00e0ff;--glass:rgba(13,16,24,.55)
  }
  *{box-sizing:border-box}html,body{height:100%;margin:0}
  body{font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);background:#000;overflow:hidden}
  .bg{position:fixed;inset:0;z-index:-1}
  .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(0px) brightness(.65);opacity:0;transition:opacity 1s ease}
  .bg img.active{opacity:1}
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);text-align:center;padding:24px 32px;background:var(--glass);border:1px solid rgba(232,77,255,.25);backdrop-filter:blur(6px);border-radius:14px}
  h1{font-weight:800;letter-spacing:.5px;margin:0 0 6px;font-size:56px;background:linear-gradient(90deg,var(--accent),var(--cyan));-webkit-background-clip:text;color:transparent}
  .subtitle{font-weight:600;color:var(--text);opacity:.9}
  .links{position:absolute;left:24px;top:24px;display:flex;flex-direction:column;gap:12px}
  .link{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;padding:10px 14px;background:var(--glass);border:1px solid rgba(0,224,255,.2);border-radius:10px}
  .panel{position:absolute;right:24px;bottom:24px;min-width:340px;background:var(--glass);border:1px solid rgba(232,77,255,.25);padding:16px 18px;border-radius:12px}
  .row{display:flex;justify-content:space-between;color:var(--muted);margin:4px 0}
  .progress{
    width:560px;
    max-width:80vw;
    height:14px;
    margin:24px auto 0;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 0 20px rgba(232,77,255,.25);
}
  .bar{
    height:100%;
    width:0;
    background:linear-gradient(90deg,#e84dff,#00e0ff);
    transition:width .2s ease;
    box-shadow:
        0 0 8px #e84dff,
        0 0 18px #00e0ff,
        0 0 30px #00e0ff;
}
  .pct{margin-top:8px;color:var(--muted);font-size:14px}
  @media (max-width:720px){h1{font-size:36px}.progress{width:90vw}.panel{position:static;margin:16px}.center{transform:none;position:static;margin:80px 16px}}
</style>
</head>
<body>
  <div class="bg">
    <img src="Screenshot_83.png" class="active" alt="">
    <img src="Screenshot_84.png" alt="">
    <img src="Screenshot_85.png" alt="">
    <img src="Screenshot_87.png" alt="">
</div>

 <div class="links">
    <a class="link" href="https://discord.gg/UmGHaVrZ" target="_blank">Discord</a>
    <a class="link" href="https://t.me/PixelCanvasSandboxServer" target="_blank">Telegram</a>
</div>

  <div class="center">
    <h1>PixelSandbox</h1>
    <div class="subtitle"> • UA Украинский Sandbox • 100+ аддонов • Безграничные возможности • Активное сообщество • </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="pct" id="pct">Загрузка... 0%</div>
  </div>

<div class="panel" id="serverInfo">
    <div class="row">
        <span>🗺 Карта</span>
        <strong id="map">Загрузка...</strong>
    </div>

    <div class="row">
        <span>👥 Игроков</span>
        <strong id="players">0 / 20</strong>
    </div>

    <div class="row">
        <span>🎮 Режим</span>
        <strong id="mode">Sandbox</strong>
    </div>
</div>

<script>
const bar = document.getElementById("bar");
const pct = document.getElementById("pct");
// =====================
// Слайдшоу
// =====================
const slides = document.querySelectorAll(".bg img");
let currentSlide = 0;

function changeSlide() {

    slides[currentSlide].classList.remove("active");

    currentSlide++;

    if (currentSlide >= slides.length)
        currentSlide = 0;

    slides[currentSlide].classList.add("active");
}

setInterval(changeSlide, 5000);

// =====================
// Полоса загрузки
// =====================
const stages = {
    "Sending client info": 10,
    "Receiving server info": 20,
    "Starting Lua": 40,
    "Downloading": 70,
    "Mounting Addons": 90
};

window.SetStatusChanged = function(status) {

    pct.textContent = status;

    for (const key in stages) {

        if (status.includes(key)) {

            bar.style.width = stages[key] + "%";
            return;
        }
    }
};

window.DownloadingFile = function(file) {
    pct.textContent = "📥 " + file;
};

window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid) {
    document.getElementById("map").textContent = mapname;
};

window.SetFilesTotal = function(total) {
    window.totalFiles = total;
};

window.SetFilesNeeded = function(needed) {
    if (!window.totalFiles) return;

    const loaded = window.totalFiles - needed;
    const percent = Math.floor((loaded / window.totalFiles) * 100);

    bar.style.width = percent + "%";
    pct.textContent = "Загрузка файлов... " + percent + "%";
};

// =====================
// Получение данных сервера
// =====================
async function updateServer() {

    try {

        const res = await fetch("http://26.214.76.58:3000/status");
        const data = await res.json();

        if (data.online) {

            document.getElementById("map").textContent = data.map;

            document.getElementById("players").textContent =
                data.players + " / " + data.maxplayers;

            document.getElementById("mode").textContent = "Sandbox";

        } else {

            document.getElementById("map").textContent = "Сервер офлайн";
            document.getElementById("players").textContent = "--";

        }

    } catch (err) {

        console.log(err);

    }

}

updateServer();

setInterval(updateServer, 10000);

// =====================
// Данные GMod
// =====================
window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid) {

    document.getElementById("map").textContent = mapname;

}
