<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PixelSandbox — загрузка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:clamp(8px,.68vw,15px)}
html,body{width:100%;height:100%;overflow:hidden;background:#08090c;color:#f2f1ec;font-family:'Segoe UI',Arial,sans-serif}
:root{--o:#19e6a8;--p:rgba(14,15,19,.9);--b:rgba(255,255,255,.08);--g:#9a9aa3}

/* фон: сетка + неоновое свечение, как на сайте */
.bg{position:fixed;inset:0;background:
  radial-gradient(60rem 40rem at 50% 38%,rgba(25,230,168,.11),transparent 70%),
  radial-gradient(40rem 30rem at 85% 90%,rgba(25,230,168,.06),transparent 70%),#08090c}
.grid{position:fixed;inset:-50% -10% -10% -10%;background-image:
  linear-gradient(rgba(25,230,168,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(25,230,168,.07) 1px,transparent 1px);
  background-size:4rem 4rem;transform:perspective(40rem) rotateX(62deg);transform-origin:50% 100%;
  animation:mv 6s linear infinite;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes mv{to{background-position:0 4rem}}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}

.wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:54rem;display:flex;flex-direction:column;gap:1.6rem}
.top{text-align:left}
.logo{font-weight:800;text-transform:uppercase;font-size:4.2rem;line-height:1;letter-spacing:.04em;margin-top:.5rem}
.logo span{color:var(--o);animation:breathe 3.2s ease-in-out infinite;display:inline-block}
@keyframes breathe{0%,100%{opacity:.82;text-shadow:0 0 .4rem rgba(25,230,168,.35),0 0 1.2rem rgba(25,230,168,.2)}50%{opacity:1;text-shadow:0 0 .8rem rgba(25,230,168,.85),0 0 2.6rem rgba(25,230,168,.55),0 0 4.5rem rgba(25,230,168,.25)}}

.card{position:relative;background:linear-gradient(160deg,rgba(20,22,28,.92),rgba(10,11,14,.92));border:1px solid var(--b);border-left:3px solid var(--o);padding:1.2rem 1.4rem 1.1rem;backdrop-filter:blur(14px);box-shadow:0 0 3rem rgba(25,230,168,.08),inset 0 0 0 1px rgba(255,255,255,.02)}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:1.5rem;border:1px solid var(--b);background:rgba(255,255,255,.025)}
.info>div{padding:.8rem 1rem;border-right:1px solid var(--b)}.info>div:last-child{border-right:0}
.info h3{font:.68rem Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--g);margin-bottom:.35rem}
.info b{font-size:1.1rem;font-weight:700;word-break:break-all;color:#f2f1ec}

.bar-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.7rem}
#status{font:.8rem Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:.6rem}
#status:before{content:"";width:.5rem;height:.5rem;background:var(--o);box-shadow:0 0 .6rem var(--o);animation:bl 1s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
#pct{font:800 1.8rem/1 'Segoe UI',Arial,sans-serif;color:var(--o);text-shadow:0 0 1rem rgba(25,230,168,.5);letter-spacing:.02em}
.bar{height:1.1rem;background:rgba(255,255,255,.05);border:1px solid var(--b);padding:2px;position:relative}
.bar:before{content:"";position:absolute;inset:2px;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),rgba(8,9,12,.9) calc(5% - 2px) 5%);z-index:2;pointer-events:none}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#0fa57a,var(--o) 70%,#8bffd9);box-shadow:0 0 1rem rgba(25,230,168,.75);transition:width .35s ease;position:relative;overflow:hidden}
#fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.4s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#file{font:.72rem Consolas,monospace;color:#6a6a73;margin-top:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}

.tip{display:flex;gap:.8rem;align-items:center;font-size:1rem;color:#c9c9ce;min-height:2.6rem;transition:opacity .4s}
.tip i{font:700 .75rem Consolas,monospace;font-style:normal;padding:.25rem .55rem;border:1px solid var(--o);color:var(--o);letter-spacing:.12em;white-space:nowrap}

.foot{position:fixed;left:5%;bottom:3%;font:.65rem Consolas,monospace;letter-spacing:.14em;color:#2b2d34}
</style>
</head>
<body>
<!-- Фоновая музыка: положи music.mp3 рядом с этим HTML на хостинге (или замени src на прямую ссылку на mp3) -->
<audio id="bgm" src="music.mp3" loop autoplay preload="auto"></audio>
<div class="bg"></div><div class="grid"></div><div class="scan"></div>

<div class="wrap">
  <div class="top">
    <div class="logo">Pixel<span>Sandbox</span></div>
  </div>

  <div class="card">
    <div class="info">
      <div><h3>Карта</h3><b id="map">—</b></div>
      <div><h3>Игроки</h3><b id="pl">— / —</b></div>
      <div><h3>Режим</h3><b id="mode">sandbox</b></div>
      <div><h3>Сервер</h3><b id="sname">PixelSandbox</b></div>
    </div>
    <div class="bar-head"><span id="status">Подключение</span><span id="pct">0%</span></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="file"></div>
  </div>

  <div class="tip" id="tipbox"><i>СОВЕТ</i><span id="tip"></span></div>
</div>

<div class="foot">PIXELSANDBOX.UA</div>

<script>
/* фоновая музыка: громкость 0.5, loop, повтор автозапуска + старт по первому клику/клавише */
(function(){var b=document.getElementById("bgm");if(!b)return;b.volume=.5;var k=function(){try{var p=b.play();if(p&&p.catch)p.catch(function(){})}catch(e){}};k();addEventListener("pointerdown",k);addEventListener("keydown",k)})();
var $=function(i){return document.getElementById(i)};
var total=0,needed=0,pct=0;

function setPct(p){
  p=Math.max(pct,Math.min(100,Math.round(p)));pct=p;
  $('fill').style.width=p+'%';$('pct').textContent=p+'%';
}
function upd(){ if(total>0) setPct((total-needed)/total*100) }

/* ---- API загрузочного экрана GMod ---- */
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){
  if(servername)$('sname').textContent=servername;
  if(mapname)$('map').textContent=mapname;
  if(maxplayers)$('pl').textContent='— / '+maxplayers;
  if(gamemode)$('mode').textContent=gamemode;
}
function SetFilesTotal(t){total=+t||0;upd()}
function SetFilesNeeded(n){needed=+n||0;upd()}
function DownloadingFile(f){
  $('status').textContent='Загрузка файлов';
  $('file').textContent=String(f||'').split('?')[0];
}
function SetStatusChanged(s){
  s=String(s||'');
  var m={'Sending client info...':'Отправка данных клиента','Workshop Complete':'Workshop загружен','Client info sent!':'Данные отправлены','Starting Lua...':'Запуск Lua','Retrieving server info...':'Получение данных сервера'};
  $('status').textContent=m[s]||s;
  if(/Starting Lua/i.test(s)) setPct(97);
  else if(/Client info sent/i.test(s)) setPct(Math.max(pct,92));
  else if(/Sending client info/i.test(s)) setPct(Math.max(pct,85));
  else if(/Workshop Complete/i.test(s)) setPct(Math.max(pct,80));
}

/* параметры из URL (на случай sv_loadingurl с подстановкой) */
(function(){
  var q=location.search.replace('?','').split('&');
  for(var i=0;i<q.length;i++){var kv=q[i].split('=');
    if(kv[0]=='map')$('map').textContent=decodeURIComponent(kv[1]||'');
    if(kv[0]=='max')$('pl').textContent='— / '+decodeURIComponent(kv[1]||'');}
})();

/* ---- советы ---- */
var tips=[
 'Не бойся экспериментировать — Sandbox создан для творчества.',
 'Сохраняй постройки через Advanced Duplicator — перед рестартом сервера.',
 'Нажми F4, чтобы открыть меню: профиль, правила и жалобы.',
 'Привяжи Discord командой !link в игровом чате и получи роль «Проверенный».',
 'Увидел нарушителя? Подай жалобу через F4 → Жалобы.',
 'Не толкай чужие пропы через PhysGun — это PropPush и наказуемо.',
 'Сервер работает ежедневно с 8:00 до 00:00. Плановые рестарты — с предупреждением в чате.',
 'Хочешь в команду? Заявка на стафф — в нашем Discord.'
];
var ti=Math.floor(Math.random()*tips.length),tb=$('tipbox');
function showTip(){$('tip').textContent=tips[ti];ti=(ti+1)%tips.length}
showTip();
setInterval(function(){tb.style.opacity=0;setTimeout(function(){showTip();tb.style.opacity=1},400)},6000);
</script>
</body>
</html>
