<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PixelSandbox — загрузка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:clamp(8px,.68vw,15px)}
html,body{width:100%;height:100%;overflow:hidden;background:#08090c;color:#f2f1ec;font-family:'Segoe UI',Arial,sans-serif}
:root{--o:#19e6a8;--p:rgba(14,15,19,.9);--b:rgba(255,255,255,.08);--g:#9a9aa3}

/* фон: сетка + неоновое свечение, как на сайте */
.bg{position:fixed;inset:0;background:
  radial-gradient(60rem 40rem at 50% 38%,rgba(25,230,168,.11),transparent 70%),
  radial-gradient(40rem 30rem at 85% 90%,rgba(25,230,168,.06),transparent 70%),#08090c}
.grid{position:fixed;inset:-50% -10% -10% -10%;background-image:
  linear-gradient(rgba(25,230,168,.07) 1px,transparent 1px),
  linear-gradient(90deg,rgba(25,230,168,.07) 1px,transparent 1px);
  background-size:4rem 4rem;transform:perspective(40rem) rotateX(62deg);transform-origin:50% 100%;
  animation:mv 6s linear infinite;mask-image:linear-gradient(to top,#000 10%,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes mv{to{background-position:0 4rem}}
.scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}

.wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:54rem;display:flex;flex-direction:column;gap:1.6rem}
.top{text-align:left}
.logo{font-weight:800;text-transform:uppercase;font-size:4.2rem;line-height:1;letter-spacing:.04em;margin-top:.5rem;color:#f2f1ec}
.logo span{display:inline-block;color:var(--o);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85;text-shadow:0 0 .4rem rgba(25,230,168,.35),0 0 1.2rem rgba(25,230,168,.2)}50%{opacity:1;text-shadow:0 0 .8rem rgba(25,230,168,.85),0 0 2.6rem rgba(25,230,168,.55),0 0 4.5rem rgba(25,230,168,.25)}}

.card{position:relative;background:rgba(5,6,8,.9);border:1px solid rgba(255,255,255,.05);border-left:3px solid rgba(25,230,168,.8);padding:1.2rem 1.4rem 1.1rem;backdrop-filter:blur(14px);box-shadow:0 0 2rem rgba(0,0,0,.6);transition:box-shadow .6s,border-color .6s}
.card.done{box-shadow:0 0 2.2rem rgba(25,230,168,.25);border-left-color:#19e6a8}
.info{display:grid;grid-template-columns:1.7fr .9fr .9fr 1.2fr;gap:0;margin-bottom:1.5rem;border:1px solid var(--b);background:rgba(0,0,0,.35)}
.info>div{padding:.8rem 1rem;border-right:1px solid var(--b)}.info>div:last-child{border-right:0}
.info h3{font:.68rem Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--g);margin-bottom:.35rem}
.info b{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere;color:#f2f1ec}

.bar-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.7rem}
#status{font:.8rem Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--g);display:flex;align-items:center;gap:.6rem}
#status:before{content:"";width:.5rem;height:.5rem;background:var(--o);box-shadow:0 0 .6rem var(--o);animation:bl 1s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
#pct{font:800 1.8rem/1 'Segoe UI',Arial,sans-serif;color:var(--o);text-shadow:0 0 1rem rgba(25,230,168,.5);letter-spacing:.02em}
.bar{height:1.1rem;background:rgba(255,255,255,.05);border:1px solid var(--b);padding:2px;position:relative}
.bar:before{content:"";position:absolute;inset:2px;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 2px),rgba(8,9,12,.9) calc(5% - 2px) 5%);z-index:2;pointer-events:none}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#0fa57a,var(--o) 70%,#8bffd9);box-shadow:0 0 1rem rgba(25,230,168,.75);transition:width .35s ease;position:relative;overflow:hidden}
#fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 1.4s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#file{font:.72rem Consolas,monospace;color:#6a6a73;margin-top:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}

.tip{display:flex;gap:.8rem;align-items:center;font-size:1rem;color:#c9c9ce;min-height:2.6rem;transition:opacity .4s}
.tip i{font:700 .75rem Consolas,monospace;font-style:normal;padding:.25rem .55rem;border:1px solid var(--o);color:var(--o);letter-spacing:.12em;white-space:nowrap}

.foot{position:fixed;left:5%;bottom:3%;font:.65rem Consolas,monospace;letter-spacing:.14em;color:#2b2d34}
/* лог загрузки в углу + частицы */
#parts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
#logwrap{display:flex;justify-content:center;margin-top:.6rem}
#log{font:.68rem/1.7 Consolas,monospace;letter-spacing:.06em;color:#3b3e47;white-space:pre;text-align:left;min-width:20rem;padding-left:1rem;border-left:1px solid rgba(25,230,168,.25);pointer-events:none}
#log b{color:rgba(25,230,168,.55);font-weight:400}
#log span:last-child{color:#7b7f8c}
#log span:last-child:after{content:"_";animation:bl 1s steps(1) infinite;color:var(--o)}
#rules{margin-top:.2rem;text-align:center;font-size:.8rem;line-height:1.7;color:#5d606b}
#rules b{font:700 .68rem Consolas,monospace;letter-spacing:.16em;color:rgba(25,230,168,.7);margin-right:.5rem}
.wrap{animation:fin 1.1s ease-out both}
@keyframes fin{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
#ready{position:fixed;inset:0;pointer-events:none;background:radial-gradient(40rem 25rem at 50% 50%,rgba(25,230,168,.12),transparent 70%);opacity:0;transition:opacity .8s}
#ready.on{opacity:1}
#logo{display:block;pointer-events:none}
</style>
</head>
<body>
<!-- Фоновая музыка: положи music.mp3 рядом с этим HTML на хостинге (или замени src на прямую ссылку на mp3) -->
<audio id="bgm" src="music.mp3" loop autoplay preload="auto"></audio>
<div class="bg"></div><div class="grid"></div><div class="scan"></div>

<div class="wrap">
  <div class="top">
    <canvas id="logo"></canvas>
  </div>

  <div class="card">
    <div class="info">
      <div><h3>Карта</h3><b id="map">—</b></div>
      <div><h3>Игроки</h3><b id="pl">— / —</b></div>
      <div><h3>Режим</h3><b id="mode">sandbox</b></div>
      <div><h3>Сервер</h3><b id="sname">PixelSandbox</b></div>
    </div>
    <div class="bar-head"><span id="status">Подключение</span><span id="pct">0%</span></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="file"></div>
  </div>

  <div class="tip" id="tipbox"><i id="tipcat">СОВЕТ</i><span id="tip"></span></div>
  <div id="logwrap"><div id="log"></div></div>
  <div id="rules"><div><b>ПРАВИЛА</b>Без PropPush, читов, оскорблений и рекламы без разрешения.</div><div>Нарушителя видишь — жалоба через F4 → Жалобы. Полный список — F4 → Правила.</div></div>
</div>

<div id="ready"></div><canvas id="parts"></canvas>
<div class="foot">PIXELSANDBOX.UA</div>

<script>
/* фоновая музыка: громкость 0.5, loop, повтор автозапуска + старт по первому клику/клавише */
(function(){var b=document.getElementById("bgm");if(!b)return;b.volume=.5;var k=function(){try{var p=b.play();if(p&&p.catch)p.catch(function(){})}catch(e){}};k();addEventListener("pointerdown",k);addEventListener("keydown",k)})();
/* частицы: светло-зелёные точки медленно всплывают */
(function(){var c=document.getElementById("parts");if(!c)return;var x=c.getContext("2d"),W,H,ps=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;ps=[];for(var i=0;i<70;i++)ps.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.4,v:.12+Math.random()*.3,a:.15+Math.random()*.45,p:Math.random()*7})}
addEventListener("resize",rs);rs();
(function L(){x.clearRect(0,0,W,H);var t=performance.now()/800;for(var i=0;i<ps.length;i++){var p=ps[i];p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
x.globalAlpha=p.a*(.5+.5*Math.sin(t+p.p));x.fillStyle="#19e6a8";x.beginPath();x.arc(p.x+Math.sin(p.p+p.y*.01)*6,p.y,p.r,0,6.283);x.fill()}requestAnimationFrame(L)})()})();

/* мини-лог загрузки */
/* реальный онлайн: бот отдаёт /online (укажи адрес бота, порт = API_PORT из .env) */
var ONLINE_URL='http://178.150.168.239:3000/online',maxP='—';
function showOnline(n){$('pl').textContent=n+' / '+maxP}
function pollOnline(){
  if(!ONLINE_URL)return;
  try{var x=new XMLHttpRequest();x.open('GET',ONLINE_URL+'?t='+Date.now(),true);x.timeout=4000;
    x.onload=function(){try{var d=JSON.parse(x.responseText);if(d&&d.max)maxP=d.max;if(d&&d.ok)showOnline(d.players)}catch(e){}};
    x.send()}catch(e){}
}
var logLines=[];
function addLog(t){var d=new Date(),p=function(n){return(n<10?"0":"")+n},ts=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  if(logLines.length&&logLines[logLines.length-1].t===t)return;logLines.push({t:t,ts:ts});if(logLines.length>3)logLines.shift();
  var el=document.getElementById("log");if(el)el.innerHTML=logLines.map(function(l){return"<span><b>["+l.ts+"]</b> "+String(l.t).replace(/[<>&]/g,"")+"</span>"}).join("\n")}
addLog("init pixelsandbox");
/* логотип на canvas: блик и «дыхание» без CSS-клипа текста (в браузере игры он дублирует буквы) */
(function(){var cv=document.getElementById("logo");if(!cv)return;var cx=cv.getContext("2d"),A="PIXEL",B="SANDBOX",fs,sp,pad,w,h,d,wa,wb,font;
function setup(){var rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||14;fs=Math.round(4.2*rem);sp=fs*.04;pad=Math.round(fs*.55);
 d=Math.min(window.devicePixelRatio||1,2);font="800 "+fs+"px 'Segoe UI',Arial,sans-serif";cx.font=font;
 function mw(t){var n=0;for(var i=0;i<t.length;i++)n+=cx.measureText(t[i]).width+sp;return n}
 wa=mw(A);wb=mw(B);w=Math.ceil(wa+wb)+pad*2;h=Math.ceil(fs*1.1)+pad*2;
 cv.width=w*d;cv.height=h*d;cv.style.width=w+"px";cv.style.height=h+"px";cv.style.margin=(-pad+Math.round(fs*.1))+"px 0 "+(-pad+Math.round(fs*.1))+"px "+(-pad)+"px"}
function word(t,x,y,fill){for(var i=0;i<t.length;i++){cx.fillStyle=fill;cx.fillText(t[i],x,y);x+=cx.measureText(t[i]).width+sp}}
function frame(now){var t=now/1000,b=.5+.5*Math.sin(t*6.283/3.2),c=((t%7)/7),s=-.25+Math.min(1,Math.max(0,(c-.55)/.3))*1.5;
 cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);cx.font=font;cx.textBaseline="alphabetic";var y=pad+fs*.86;
 function grad(base,hi){var g=cx.createLinearGradient(pad,0,w-pad,0),u=function(v){return Math.min(1,Math.max(0,v))};
  g.addColorStop(0,base);g.addColorStop(u(s-.09),base);g.addColorStop(u(s),hi);g.addColorStop(u(s+.09),base);g.addColorStop(1,base);return g}
 cx.shadowColor="rgba(25,230,168,0)";cx.shadowBlur=0;word(A,pad,y,grad("#f2f1ec","#ffffff"));
 cx.shadowColor="rgba(25,230,168,"+(.35+.5*b)+")";cx.shadowBlur=(8+24*b)*d/d;word(B,pad+wa,y,grad("#19e6a8","#d9fff5"));
 cx.shadowColor="rgba(25,230,168,"+(.15+.3*b)+")";cx.shadowBlur=(22+36*b);word(B,pad+wa,y,"rgba(25,230,168,.01)");
 requestAnimationFrame(frame)}
setup();addEventListener("resize",setup);requestAnimationFrame(frame)})();
var $=function(i){return document.getElementById(i)};
var total=0,needed=0,pct=0,gotNeeded=false;

function setPct(p){
  p=Math.max(pct,Math.min(100,Math.round(p)));pct=p;
  $('fill').style.width=p+'%';$('pct').textContent=p+'%';
  if(pct>=100&&!window.__done){window.__done=1;var c=document.querySelector('.card');if(c)c.className+=' done';$('ready').className='on';$('status').textContent='Готово';addLog('ready')}
}
function upd(){ if(total>0&&gotNeeded) setPct(Math.min(80,(total-needed)/total*80)) }

/* ---- API загрузочного экрана GMod ---- */
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){
  if(servername)$('sname').textContent=servername;
  if(mapname){$('map').textContent=mapname;addLog('map '+mapname)}
  if(maxplayers){maxP=maxplayers;$('pl').textContent='— / '+maxplayers}
  if(gamemode)$('mode').textContent=gamemode;
}
function SetFilesTotal(t){total=+t||0;gotNeeded=false;upd()}
function SetFilesNeeded(n){needed=+n||0;gotNeeded=true;upd()}
var lastDl=0;
function DownloadingFile(f){
  if(Date.now()-lastDl>700){lastDl=Date.now();addLog('download '+String(f||'').split('?')[0].split('/').pop())}
  $('status').textContent='Загрузка файлов';
  $('file').textContent=String(f||'').split('?')[0];
}
function SetStatusChanged(s){
  s=String(s||'');addLog(s.toLowerCase());
  var m={'Sending client info...':'Отправка данных клиента','Workshop Complete':'Workshop загружен','Client info sent!':'Данные отправлены','Starting Lua...':'Запуск Lua','Retrieving server info...':'Получение данных сервера'};
  $('status').textContent=m[s]||s;
  if(/Starting Lua/i.test(s)) setPct(100);
  else if(/Client info sent/i.test(s)) setPct(Math.max(pct,92));
  else if(/Sending client info/i.test(s)) setPct(Math.max(pct,85));
  else if(/Workshop Complete/i.test(s)) setPct(Math.max(pct,80));
}

/* параметры из URL (на случай sv_loadingurl с подстановкой) */
(function(){
  var q=location.search.replace('?','').split('&');
  for(var i=0;i<q.length;i++){var kv=q[i].split('=');
    if(kv[0]=='map')$('map').textContent=decodeURIComponent(kv[1]||'');
    if(kv[0]=='max')$('pl').textContent='— / '+decodeURIComponent(kv[1]||'');}
})();

/* ---- советы ---- */
var CATS={'СОВЕТ':'#19e6a8','ПОДСКАЗКА':'#c9c9ce','СЕРВЕР':'#5ec8ff','ПРАВИЛА':'#ffb020','КОМАНДА':'#d9a0ff','DISCORD':'#8b9cff'};
var tips=[
 ['СЕРВЕР','Сервер работает ежедневно с 8:00 до 00:00.'],
 ['СЕРВЕР','Плановые рестарты — с предупреждением в чате за 5 и за 1 минуту.'],
 ['СЕРВЕР','Перед рестартом сохрани постройки через Advanced Duplicator.'],
 ['СОВЕТ','Не бойся экспериментировать — Sandbox создан для творчества.'],
 ['СОВЕТ','Сохраняй удачные постройки через Advanced Duplicator, чтобы не потерять прогресс.'],
 ['ПОДСКАЗКА','Нажми F4, чтобы открыть меню: профиль, правила, жалобы и команды.'],
 ['ПОДСКАЗКА','Список игроков открывается клавишей TAB.'],
 ['ПРАВИЛА','Не толкай чужие пропы через PhysGun — это PropPush и наказуемо.'],
 ['ПРАВИЛА','Читы и реклама без разрешения запрещены — бан по правилам сервера.'],
 ['ПРАВИЛА','Увидел нарушителя? Подай жалобу через F4 → Жалобы с доказательствами.'],
 ['КОМАНДА','!link код — привязать Discord и получить роль «Проверенный».'],
 ['КОМАНДА','!rules — открыть правила сервера, !money — узнать свой баланс.'],
 ['DISCORD','Хочешь в команду? Заявка на стафф — в нашем Discord.'],
 ['DISCORD','Вопрос или обжалование бана? Создай тикет в Discord-сервере.']
];
var ti=Math.floor(Math.random()*tips.length),tb=$('tipbox');
function showTip(){var t=tips[ti],c=CATS[t[0]]||'#19e6a8',e=$('tipcat');e.textContent=t[0];e.style.color=c;e.style.borderColor=c;$('tip').textContent=t[1];ti=(ti+1)%tips.length}
showTip();
setInterval(function(){tb.style.opacity=0;setTimeout(function(){showTip();tb.style.opacity=1},400)},6000);
pollOnline();setInterval(pollOnline,5000);
</script>
</body>
</html>
