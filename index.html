<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelSandbox — Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#03040a;color:#eef4ff;font-family:Arial}.space{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#4f4aff25,transparent 18%),radial-gradient(circle at 50% 50%,#00bfff10,transparent 35%)}.portal{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:250px;height:250px;border-radius:50%;border:1px solid #9b8cff77;box-shadow:0 0 25px #7969ff55,0 0 120px #7969ff22,inset 0 0 40px #6d5cff33;animation:pulse 3s ease-in-out infinite}.portal:before{content:"";position:absolute;inset:28px;border-radius:50%;border:2px solid #5de5ff66;box-shadow:0 0 25px #5de5ff66;animation:spin 8s linear infinite}.portal:after{content:"PXLS";position:absolute;inset:0;display:grid;place-items:center;font-weight:bold;font-size:48px;letter-spacing:4px}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}.panel{position:absolute;left:50%;top:72%;transform:translate(-50%,-50%);width:min(760px,84vw);text-align:center}.title{font-size:34px;font-weight:700}.sub{color:#737d95;margin-top:7px}.meta{display:flex;justify-content:center;gap:55px;margin:24px}.meta span{font-size:9px;color:#5e6880;letter-spacing:2px;display:block}.meta b{display:block;margin-top:6px}.track{height:4px;background:#171b2a}.bar{height:100%;width:0;background:linear-gradient(90deg,#806cff,#5eeaff);box-shadow:0 0 18px #6e76ff;transition:width .2s}.head{display:flex;justify-content:space-between;color:#8f99ad;font-size:11px;margin-bottom:7px}.file{margin-top:9px;color:#4e586c;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tip{margin-top:18px;color:#59647a;font-size:11px}

/* ULTRA ADDON — original Portal preserved */
.portal{animation:pulse 3s ease-in-out infinite,portalGlow 4s ease-in-out infinite alternate}
.portal:before{box-shadow:0 0 45px #5de5ff88}
.portal:after{animation:portalText 2.5s ease-in-out infinite}
@keyframes portalGlow{to{box-shadow:0 0 40px #7969ff88,0 0 180px #7969ff44,inset 0 0 70px #6d5cff66}}
@keyframes portalText{50%{text-shadow:0 0 24px #5de5ff,0 0 50px #7969ff}}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,#5de5ff08,transparent 35%);animation:portalAtmosphere 3s ease-in-out infinite alternate}
@keyframes portalAtmosphere{to{opacity:.75;transform:scale(1.08)}}


/* PixelSandbox — larger layout + subtle domain signature */
.portal {
  width: 310px;
  height: 310px;
}
.portal:before { inset: 34px; }
.portal:after {
  font-size: 58px;
  letter-spacing: 5px;
}
.panel {
  top: 73%;
  width: min(900px, 88vw);
}
.title { font-size: 42px; }
.sub { font-size: 16px; margin-top: 9px; }
.meta { gap: 72px; margin: 28px; }
.meta span { font-size: 10px; }
.meta b { font-size: 15px; margin-top: 7px; }
.head { font-size: 12px; margin-bottom: 9px; }
.track { height: 5px; }
.file { font-size: 11px; margin-top: 11px; }
.tip { font-size: 12px; margin-top: 21px; }
.domain-signature {
  position: fixed;
  left: 24px;
  bottom: 18px;
  z-index: 30;
  color: rgba(157, 170, 198, .38);
  font: 11px/1 Arial, sans-serif;
  letter-spacing: 1.1px;
  pointer-events: none;
  user-select: none;
  transition: color .3s ease;
}
.domain-signature:hover { color: rgba(157, 170, 198, .55); }
@media (max-height: 760px) {
  .portal { width: 260px; height: 260px; }
  .portal:before { inset: 28px; }
  .portal:after { font-size: 48px; }
  .panel { top: 74%; }
  .title { font-size: 36px; }
  .meta { margin: 18px; gap: 54px; }

}
@media (max-width: 600px) {
  .portal { width: 230px; height: 230px; }

  .portal:after { font-size: 42px; }
  .panel { top: 70%; width: 92vw; }
  .title { font-size: 30px; }
  .meta { gap: 22px; margin: 18px 4px; }
  .meta b { font-size: 12px; }
  .tip { white-space: normal; line-height: 1.5; }
  .domain-signature { left: 14px; bottom: 12px; font-size: 10px; }
}

</style></head><body><div class="space"></div><div class="portal"></div><div class="domain-signature">pixelsandbox.ua</div><main class="panel"><div class="title" id="server">PixelSandbox</div><div class="sub">Entering sandbox dimension...</div><div class="meta"><div><span>MAP</span><b id="map">Loading...</b></div><div><span>PLAYERS</span><b><span id="players">—</span>/<span id="maxplayers">—</span></b></div><div><span>MODE</span><b id="mode">Sandbox</b></div></div><div class="head"><span id="status">Opening portal</span><b id="percent">0%</b></div><div class="track"><div class="bar" id="progress"></div></div><div class="file" id="file"></div><div class="tip" id="tip"></div></main>
<script>
/* PixelSandbox — GMod loading callbacks */
let state = {
  map: "Loading world...",
  players: "—",
  mode: "Sandbox",
  status: "Connecting",
  total: 0,
  needed: 0,
  done: 0
};

function $(id){ return document.getElementById(id); }
function setText(id, value){ const e=$(id); if(e) e.textContent=String(value); }

function updateProgress(){
  let p = 0;
  if(state.total > 0){
    p = Math.max(0, Math.min(100, ((state.total-state.needed)/state.total)*100));
  } else if(state.done > 0){
    p = Math.min(96, state.done);
  }
  const bar = $("progress");
  if(bar) bar.style.width = p + "%";
  setText("percent", Math.round(p) + "%");
}

function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language){
  state.map = mapname || "Unknown";
  state.mode = gamemode || "Sandbox";
  setText("map", state.map);
  setText("mode", state.mode);
  setText("server", servername || "PixelSandbox");
  if(typeof maxplayers !== "undefined" && $("maxplayers")) setText("maxplayers", maxplayers);
}

function SetStatusChanged(status){
  state.status = status || "Loading";
  setText("status", state.status);
}

function SetFilesTotal(total){
  state.total = Number(total) || 0;
  updateProgress();
}

function SetFilesNeeded(needed){
  state.needed = Number(needed) || 0;
  updateProgress();
}

function DownloadingFile(fileName){
  state.done++;
  setText("file", fileName || "Preparing files...");
  updateProgress();
}

async function loadPlayers(){
  try{
    const r = await fetch("player_count.php", {cache:"no-store"});
    if(!r.ok) return;
    const data = await r.json();
    const n = data.players ?? data.count ?? data.player_count;
    if(n !== undefined){
      state.players = n;
      setText("players", n);
    }
  }catch(e){}
}
loadPlayers();
setInterval(loadPlayers, 5000);

/* graceful demo state outside GMod */
setTimeout(()=>{
  if(!state.map || state.map==="Loading world...") state.map="gm_construct";
  setText("map", state.map);
}, 1800);

const tips = [
  "Добро пожаловать в PixelSandbox.",
  "Создавай. Строй. Экспериментируй.",
  "Здесь ты сам задаёшь правила.",
  "Проверь консоль, если что-то пошло не так.",
  "Новые возможности сервера появляются регулярно."
];
setText("tip", tips[Math.floor(Math.random()*tips.length)]);
</script>
</body>
<script>
/* PixelSandbox ULTRA particles — additive layer only */
(()=>{const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19;opacity:.8";document.body.appendChild(c);
const x=c.getContext("2d");let W,H,D,ps=[];
function rs(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
ps=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.4,v:.08+Math.random()*.35,a:.12+Math.random()*.5,p:Math.random()*7}))}
addEventListener("resize",rs);rs();
function loop(){x.clearRect(0,0,W,H);const accent=(getComputedStyle(document.body).color||"#fff");
for(const p of ps){p.y-=p.v;if(p.y<0)p.y=H;p.x+=Math.sin(p.p+p.y*.008)*.08;
x.globalAlpha=p.a*(.55+.45*Math.sin(performance.now()/700+p.p));x.fillStyle=accent;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}
requestAnimationFrame(loop)}loop()})();
</script>

  const el = document.getElementById("tip");
