<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelSandbox — Synth Black</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#070708;color:#eee;font:14px Arial}.synth{position:absolute;inset:0;background:linear-gradient(120deg,#00e5ff08,#ff00cc08 50%,#7d5cff08)}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,90vw);text-align:center}.title{font-size:72px;font-weight:900;letter-spacing:9px;background:linear-gradient(90deg,#5efcff,#d967ff);color:transparent;-webkit-background-clip:text;background-clip:text}@supports not ((background-clip:text) or (-webkit-background-clip:text)){.title{color:#b48cff;background:none}}.sub{color:#6d6d7c;letter-spacing:3px}.stats{display:flex;justify-content:center;gap:70px;margin:30px}.stats span{display:block;color:#666575;font-size:9px}.stats b{display:block;margin-top:6px}.head{display:flex;justify-content:space-between;color:#858395;font-size:11px}.track{height:4px;background:#1c1c22;margin-top:8px}.bar{height:100%;width:0;background:linear-gradient(90deg,#5efcff,#d967ff);transition:.2s}.file{margin-top:8px;color:#4e4e59;font-size:10px}.tip{margin-top:20px;color:#5a5967}

/* ULTRA ADDON — original Synth Black preserved */
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 4px,transparent 5px);mix-blend-mode:screen}
.synth:after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 45%,#5efcff12,transparent 22%),radial-gradient(circle at 75% 55%,#d967ff12,transparent 24%);animation:synthPulse 5s ease-in-out infinite alternate}
.panel{filter:drop-shadow(0 0 28px #5efcff12)}
.stats .pl span{display:inline;font-size:inherit;color:inherit}.stats .pl{white-space:nowrap}
@keyframes synthPulse{from{transform:scale(.96) rotate(-1deg);opacity:.45}to{transform:scale(1.05) rotate(1deg);opacity:1}}
.title{animation:synthGlitch 4.5s infinite}
@keyframes synthGlitch{0%,92%,100%{transform:none}94%{transform:translateX(2px);filter:hue-rotate(25deg)}96%{transform:translateX(-2px);filter:hue-rotate(-25deg)}}

.watermark{position:fixed;left:22px;bottom:18px;z-index:30;font-size:10px;font-weight:900;letter-spacing:normal;text-transform:uppercase;background:linear-gradient(90deg,#5efcff,#d967ff);color:transparent;background-clip:text;-webkit-background-clip:text;opacity:.25;pointer-events:none;user-select:none}</style></head><body><!-- Фоновая музыка: положи music.mp3 рядом с этим HTML на сервере, либо замени src на raw-ссылку GitHub (https://raw.githubusercontent.com/USER/REPO/BRANCH/music.mp3) --><audio id="bgm" src="music.mp3" loop autoplay preload="auto"></audio><div class="watermark">pixelsandbox.ua</div><div class="synth"></div><main class="panel"><div class="title" id="server">PIXELSANDBOX</div><div class="stats"><div><span>MAP</span><b id="map">---</b></div><div><span>PLAYERS</span><b class="pl"><span id="players">—</span> / <span id="maxplayers">—</span></b></div><div><span>MODE</span><b id="mode">SANDBOX</b></div></div><div class="head"><span id="status">Connecting</span><b id="percent">0%</b></div><div class="track"><div class="bar" id="progress"></div></div><div class="file" id="file"></div><div class="tip" id="tip"></div></main></body>
<script>
/* фоновая музыка: громкость 0.5, loop, retry автозапуска + старт по первому клику/клавише */
(()=>{const b=document.getElementById("bgm");if(!b)return;b.volume=.5;const k=()=>b.play().catch(()=>{});k();addEventListener("pointerdown",k);addEventListener("keydown",k)})();
let S={map:"Loading world...",players:"—",mode:"Sandbox",status:"Connecting",total:0,needed:0,done:0};
const $=id=>document.getElementById(id);
const set=(id,v)=>{if($(id))$(id).textContent=String(v)};
let P=0,SP=0;
function progress(){
 /* файлы: до 95%, дальше добивают статусы подключения; бар никогда не откатывается назад */
 let f=S.total>0?Math.max(0,Math.min(95,((S.total-S.needed)/S.total)*95)):Math.min(90,S.done*2);
 P=Math.min(100,Math.max(P,f,SP));
 if($("progress"))$("progress").style.width=P+"%"; set("percent",Math.round(P)+"%");
}
function statusProgress(s){
 s=String(s||"").toLowerCase();
 let v=0;
 if(/client info sent|connected|spawn/.test(s))v=100;
 else if(/starting lua/.test(s))v=98;
 else if(/workshop|mounting/.test(s))v=60;
 else if(/retrieving server info|server info/.test(s))v=25;
 else if(/sending client info/.test(s))v=15;
 else if(/initial connection|connecting/.test(s))v=5;
 SP=Math.max(SP,v);progress();
}
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode,volume,language){
 S.map=mapname||"Unknown"; S.mode=gamemode||"Sandbox";
 set("map",S.map); set("mode",S.mode);
 if($("maxplayers"))set("maxplayers",maxplayers??"—");
}
function SetStatusChanged(status){S.status=status||"Loading";set("status",S.status);statusProgress(S.status)}
function SetFilesTotal(total){S.total=Number(total)||0;progress()}
function SetFilesNeeded(needed){S.needed=Number(needed)||0;progress()}
function DownloadingFile(fileName){S.done++;set("file",fileName||"Preparing files...");progress()}
async function players(){
 try{let r=await fetch("player_count.php",{cache:"no-store"});if(!r.ok)return;
 let d=await r.json(),n=d.players??d.count??d.player_count;
 if(n!=null){S.players=n;set("players",n)}}catch(e){}
}
players();setInterval(players,5000);
setTimeout(()=>{if(S.map==="Loading world..."){S.map="gm_construct";set("map",S.map)}},1800);

</script>

<script>
/* PixelSandbox ULTRA particles — additive layer only */
(()=>{const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19;opacity:.8";document.body.appendChild(c);
const x=c.getContext("2d");let W,H,D,ps=[];
function rs(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
ps=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.4,v:.08+Math.random()*.35,a:.12+Math.random()*.5,p:Math.random()*7}))}
addEventListener("resize",rs);rs();
function loop(){x.clearRect(0,0,W,H);const accent=(getComputedStyle(document.body).color||"#fff");
for(const p of ps){p.y-=p.v;if(p.y<0)p.y=H;p.x+=Math.sin(p.p+p.y*.008)*.08;
x.globalAlpha=p.a*(.55+.45*Math.sin(performance.now()/700+p.p));x.fillStyle=accent;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill()}
requestAnimationFrame(loop)}loop()})();
</script>

  const el = document.getElementById("tip");
  if (!el || !tips.length) return;

  el.style.transition =
    "opacity 650ms cubic-bezier(.22,1,.36,1), " +

  el.style.willChange = "opacity, transform, filter";
  el.style.opacity = "1";
  el.style.transform = "translateY(0)";
  el.style.filter = "blur(0)";

  function changeTip() {
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    el.style.filter = "blur(4px)";

    setTimeout(() => {
      index = (index + 1) % tips.length;

      requestAnimationFrame(() => {

      });
