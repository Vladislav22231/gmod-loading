<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelSandbox Loading Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b0e14;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #e84dff;
    --cyan: #00e0ff;
    --glass: rgba(13, 16, 24, .65);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    color: var(--text);
    background: #090b10;
    overflow: hidden;
    user-select: none;
    height: 100vh;
}

/* Фоны и Слайд-шоу */
.background {
    position: fixed;
    inset: 0;
    z-index: 1;
    /* Гарантированный стартовый фон вшит прямо в CSS */
    background-color: #0d1117;
    background-image: 
        radial-gradient(at 0% 0%, rgba(238, 77, 255, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 224, 255, 0.2) 0px, transparent 50%),
        url('https://vladislav22231.github.io/gmod-loading/1.jpg');
    background-size: cover;
    background-position: center;
}

.background img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(.65);
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
}

.background img.active {
    opacity: 1;
}

.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
    z-index: 2;
}

/* Общий стиль стеклянных панелей */
.glass-panel {
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(232, 77, 255, .3);
    border-radius: 14px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

/* Кнопки слева вверху */
.social-buttons {
    position: absolute;
    top: 24px;
    left: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
}

.btn {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    text-decoration: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid rgba(0, 224, 255, .25);
    border-radius: 10px;
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: var(--cyan);
}

/* Центральный блок */
.center-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 780px;
    max-width: 95vw;
    padding: 26px 30px;
    text-align: center;
    z-index: 10;
}

h1.title {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: .5px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Подзаголовок ровно в 1 строку */
.subtitle {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    opacity: .95;
    margin-bottom: 24px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Прогресс бар */
.progress-container {
    width: 100%;
    height: 14px;
    background: rgba(255, 255, 255, .08);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .12);
    box-shadow: 0 0 20px rgba(232, 77, 255, .25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e84dff, #00e0ff);
    transition: width 0.2s ease;
    box-shadow: 0 0 8px #e84dff, 0 0 18px #00e0ff, 0 0 30px #00e0ff;
}

.status-text {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Карточка информации внизу справа */
.info-card {
    position: absolute;
    right: 24px;
    bottom: 24px;
    min-width: 340px;
    padding: 16px 18px;
    font-size: 14px;
    z-index: 10;
}

.info-row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    color: var(--muted);
}

.info-value {
    color: var(--text);
    font-weight: 600;
    text-align: right;
    max-width: 180px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

@media (max-width: 768px) {
    h1.title { font-size: 36px; }
    .subtitle { font-size: 10px; }
    .center-card { transform: none; position: static; margin: 80px 16px; width: auto; }
    .info-card { position: static; margin: 16px; }
}
</style>
</head>
<body>

<!-- Фоны и Слайд-шоу -->
<div class="background" id="bgContainer">
    <img src="https://raw.githubusercontent.com/Vladislav22231/gmod-loading/main/1.jpg" class="active" alt="bg1" crossorigin="anonymous">
    <img src="https://raw.githubusercontent.com/Vladislav22231/gmod-loading/main/2.jpg" alt="bg2" crossorigin="anonymous">
    <img src="https://raw.githubusercontent.com/Vladislav22231/gmod-loading/main/3.jpg" alt="bg3" crossorigin="anonymous">
    <img src="https://raw.githubusercontent.com/Vladislav22231/gmod-loading/main/4.jpg" alt="bg4" crossorigin="anonymous">
</div>

<div class="overlay"></div>

<!-- Кнопки Соцсетей -->
<div class="social-buttons">
    <a href="https://discord.gg/UmGHaVrZ" target="_blank" class="btn glass-panel">Discord</a>
    <a href="https://t.me/PixelCanvasSandboxServer" target="_blank" class="btn glass-panel">Telegram</a>
</div>

<!-- Центральное меню -->
<div class="center-card glass-panel">
    <h1 class="title">PixelSandbox</h1>
    <div class="subtitle">• UA Украинский Sandbox • 100+ аддонов • Безграничные возможности • Активное сообщество •</div>

    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="status-text" id="status">Подключение... 0%</div>
</div>

<!-- Инфо-блок снизу справа -->
<div class="info-card glass-panel">
    <div class="info-row">
        <span>🗺 Карта</span>
        <strong class="info-value" id="map-name">Загрузка...</strong>
    </div>
    <div class="info-row">
        <span>👥 Игроков</span>
        <strong class="info-value" id="players-count">0 / 20</strong>
    </div>
    <div class="info-row">
        <span>🎮 Режим</span>
        <strong class="info-value" id="gamemode">Sandbox</strong>
    </div>
</div>

<script>
/* ===== ПРЕДЗАГРУЗКА И СЛАЙД-ШОУ ===== */
const slides = document.querySelectorAll(".background img");
let currentSlide = 0;

function changeSlide() {
    if (slides.length <= 1) return;
    
    // Проверяем, прогрузилась ли следующая картинка
    let nextSlide = (currentSlide + 1) % slides.length;
    
    slides[currentSlide].classList.remove("active");
    slides[nextSlide].classList.add("active");
    currentSlide = nextSlide;
}

setInterval(changeSlide, 5000);

/* ===== ЭТАПЫ И НАСТОЯЩИЙ ПРОГРЕСС ЗАГРУЗКИ ===== */
const bar = document.getElementById("bar");
const statusText = document.getElementById("status");

const stages = {
    "Sending client info": 10,
    "Receiving server info": 20,
    "Starting Lua": 40,
    "Downloading": 70,
    "Mounting Addons": 90
};

window.SetStatusChanged = function(status) {
    statusText.textContent = status;

    for (const key in stages) {
        if (status.includes(key)) {
            bar.style.width = stages[key] + "%";
            return;
        }
    }
};

window.DownloadingFile = function(file) {
    statusText.textContent = "📥 " + file;
};

window.SetFilesTotal = function(total) {
    window.totalFiles = total;
};

window.SetFilesNeeded = function(needed) {
    if (!window.totalFiles) return;

    const loaded = window.totalFiles - needed;
    const percent = Math.floor((loaded / window.totalFiles) * 100);

    bar.style.width = percent + "%";
    statusText.textContent = "Загрузка файлов... " + percent + "%";
};

/* ===== ДАННЫЕ GMOD ПРИ ВХОДЕ ===== */
window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("map-name").textContent = mapname || "Загрузка...";
    document.getElementById("players-count").textContent = "0 / " + (maxplayers || "20");
    if (gamemode) {
        document.getElementById("gamemode").textContent = gamemode;
    }
};

/* ===== ПОЛУЧЕНИЕ ДАННЫХ С ВНЕШНЕГО СЕРВЕРА ===== */
async function updateServer() {
    try {
        const res = await fetch("http://26.214.76.58:3000/status");
        const data = await res.json();

        if (data.online) {
            document.getElementById("map-name").textContent = data.map;
            document.getElementById("players-count").textContent = data.players + " / " + data.maxplayers;
            document.getElementById("gamemode").textContent = "Sandbox";
        } else {
            document.getElementById("map-name").textContent = "Сервер офлайн";
            document.getElementById("players-count").textContent = "--";
        }
    } catch (err) {
        console.log("Ошибка загрузки внешнего статуса:", err);
    }
}

updateServer();
setInterval(updateServer, 10000);
</script>

</body>
</html>
