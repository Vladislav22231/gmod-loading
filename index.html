<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PixelSandbox Loading Screen</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    user-select: none;
}

/* Фоны и Слайд-шоу */
.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: background-image 1s ease-in-out;
    z-index: 1;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.25);
    z-index: 2;
}

/* Общий стиль стеклянных панелей (Glassmorphism) */
.glass-panel {
    background: rgba(18, 16, 28, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

/* Кнопки слева вверху */
.social-buttons {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
}

.btn {
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    color: #e0e0e0;
    text-decoration: none;
    text-align: center;
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn:hover {
    background: rgba(255, 255, 255, 0.2);
    color: #ffffff;
}

/* Центральный блок */
.center-card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    max-width: 650px;
    padding: 30px 40px;
    text-align: center;
    z-index: 10;
}

h1.title {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #a855f7, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
}

.subtitle {
    font-size: 13px;
    color: #cccccc;
    margin-bottom: 25px;
    word-spacing: 2px;
}

/* Прогресс бар */
.progress-container {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    box-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
    transition: width 0.2s ease;
    border-radius: 20px;
}

.status-text {
    font-size: 12px;
    color: #aaaaaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Карточка информации внизу справа */
.info-card {
    position: absolute;
    bottom: 25px;
    right: 25px;
    width: 260px;
    padding: 12px 16px;
    font-size: 12px;
    z-index: 10;
}

.info-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    color: #aaaaaa;
}

.info-row:last-child {
    margin-bottom: 0;
}

.info-value {
    color: #ffffff;
    font-weight: 600;
    text-align: right;
    max-width: 140px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
</style>

</head>
<body>

<div class="background" id="bg"></div>
<div class="overlay"></div>

<!-- Кнопки Соцсетей -->
<div class="social-buttons">
    <a href="#" class="btn glass-panel">Discord</a>
    <a href="#" class="btn glass-panel">Telegram</a>
</div>

<!-- Центральное меню -->
<div class="center-card glass-panel">
    <h1 class="title">PixelSandbox</h1>
    <div class="subtitle">• UA Украинский SandBox • 100+ аддонов • Безграничные возможности • Активное сообщество •</div>

    <div class="progress-container">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="status-text" id="status">Подключение... 0%</div>
</div>

<!-- Инфо-блок снизу справа -->
<div class="info-card glass-panel">
    <div class="info-row">
        <span>✈ Карта</span>
        <span class="info-value" id="map-name">Загрузка...</span>
    </div>
    <div class="info-row">
        <span>👥 Игроков</span>
        <span class="info-value" id="players-count">0 / 20</span>
    </div>
    <div class="info-row">
        <span>🎮 Режим</span>
        <span class="info-value" id="gamemode">Sandbox</span>
    </div>
</div>

<script>
/* ===== ФОНЫ / СЛАЙД-ШОУ ===== */
let images = [
    "https://vladislav22231.github.io/gmod-loading/Screenshot_83.png",
    "https://vladislav22231.github.io/gmod-loading/Screenshot_84.png",
    "https://vladislav22231.github.io/gmod-loading/Screenshot_85.png",
    "https://vladislav22231.github.io/gmod-loading/Screenshot_87.png"
];

let index = 0;
let bg = document.getElementById("bg");

function changeBG() {
    bg.style.backgroundImage = "url('" + images[index] + "')";
    index = (index + 1) % images.length;
}

setInterval(changeBG, 5000);
changeBG();

/* ===== НАСТОЯЩИЙ ПРОГРЕСС ЗАГРУЗКИ GMOD ===== */
let totalFiles = 0;
let filesLeft = 0;
let currentProgress = 0;

let bar = document.getElementById("bar");
let statusText = document.getElementById("status");

// Обновление шкалы
function updateProgressBar(percentage) {
    if (percentage > 100) percentage = 100;
    if (percentage < currentProgress) percentage = currentProgress; // Прогресс не идет назад
    
    currentProgress = percentage;
    bar.style.width = percentage.toFixed(0) + "%";
}

// Вызывается GMod: Передает общее кол-во файлов
function SetFilesNeeded(needed) {
    totalFiles = needed;
}

// Вызывается GMod: Передает сколько файлов осталось скачать
function SetFilesRemaining(remaining) {
    filesLeft = remaining;
    if (totalFiles > 0) {
        let downloaded = totalFiles - filesLeft;
        let percentage = (downloaded / totalFiles) * 100;
        
        updateProgressBar(percentage);
        statusText.innerText = `Загрузка файлов (${downloaded}/${totalFiles})... ${Math.floor(percentage)}%`;
    }
}

// Вызывается GMod: Имя скачиваемого файла
function DownloadingFile(file) {
    statusText.innerText = "Загрузка: " + file;
}

// Вызывается GMod: Изменение статуса (например, "Sending client info...")
function SetStatusChanged(status) {
    statusText.innerText = status;
    
    // Популярные этапы загрузки GMod для плавной анимации
    if (status.includes("Workshop")) updateProgressBar(20);
    else if (status.includes("Mounting")) updateProgressBar(40);
    else if (status.includes("Client info")) updateProgressBar(85);
    else if (status.includes("Lua")) updateProgressBar(95);
}

// Вызывается GMod: Данные сервера
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    document.getElementById("map-name").innerText = mapname || "Неизвестно";
    document.getElementById("players-count").innerText = "0 / " + (maxplayers || "20");
    if (gamemode) {
        document.getElementById("gamemode").innerText = gamemode;
    }
}
</script>

</body>
</html>
